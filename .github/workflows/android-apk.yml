
name: Build JANGAN MENENGOK APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Extract game project
        run: |
          mkdir project
          unzip "JANGAN_MENENGOK_v1_9_3_OFFLINE_DAN_IKON.zip" -d project
          test -f project/package.json

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Prepare game
        working-directory: project
        run: npm run build

      - name: Create Android project
        working-directory: project
        run: npx cap add android

      - name: Generate app icons
        working-directory: project
        run: npx capacitor-assets generate --android

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JANGAN-MENENGOK-v1.9.3-debug-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
